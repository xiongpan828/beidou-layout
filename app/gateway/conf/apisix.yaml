# 统一入口路由（standalone，打进镜像；文件末尾必须保留 #END）
#
# upstream 写短服务名，由容器 DNS（search 域）解析（k8s 同命名空间）。
# 需要密钥 / 环境相关的值时用 ${{VAR}} 从环境变量注入（APISIX 启动时替换，缺失直接启动失败）。
# 认证 / 鉴权插件按需加在 apisix/plugins/，并在 conf/config.yaml 的 plugins 里登记。

upstreams:
  - id: web-admin
    type: roundrobin
    nodes:
      "web-admin:80": 1

  - id: api-service
    type: roundrobin
    nodes:
      "api-service:8100": 1

  - id: admin-service
    type: roundrobin
    nodes:
      "admin-service:8000": 1

  - id: storage-service
    type: roundrobin
    nodes:
      "storage-service:9301": 1

routes:
  # ---------- API ----------
  # C 端 → api-service
  - id: consumer-api
    uri: /api/v1/consumer/*
    methods: [GET, POST, OPTIONS]
    upstream_id: api-service
    priority: 90

  # B 端（运营后台）→ admin-service
  - id: admin-api
    uri: /api/v1/admin/*
    methods: [GET, POST, OPTIONS]
    upstream_id: admin-service
    priority: 90

  # ---------- 文件读写 → storage-service HTTP ----------
  # 不经过 BFF：地址本身带签名（私有读 / 上传），由 storage-service 校验；公有读 scope 不需要签名。
  # 大小上限 = conf/config.yaml 的 client_max_body_size；请求体不在网关落盘缓冲，直接流给上游
  - id: storage-file
    uri: /api/v1/storage/*
    methods: [GET, PUT]
    upstream_id: storage-service
    priority: 90
    plugins:
      proxy-control:
        request_buffering: false

  # ---------- 运营后台：其余路径全部到 web-admin（其 nginx 把 / 跳到 /admin/） ----------
  - id: admin-web
    uri: /*
    upstream_id: web-admin
    priority: 1

#END
