# 运营后台镜像的 nginx：托管 /admin/ 下的 SPA，API 由网关直接转给 BFF，不经过这里。
server {
    listen 80;
    server_name _;

    # 容器内部监听 80，对外端口可能不同；关闭绝对跳转，返回相对 Location
    absolute_redirect off;

    root /usr/share/nginx/html;

    location = /admin {
        return 302 /admin/;
    }

    # 带 contenthash 的 JS/CSS 永不覆盖，浏览器长期缓存
    location ~* "^/admin/.+\.[a-f0-9]{8}(?:\.async)?\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML（含 SPA 回退）不缓存：发布后浏览器立即拿到新页面
    location /admin/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # 网关把 /* 都转到这里：其余路径回后台首页
    location / {
        return 302 /admin/;
    }
}
